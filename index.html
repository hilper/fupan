  <script>
    (() => {
      function showError(reason) {
        const message = reason?.message || String(reason || "發生未知錯誤");
        if (window.appReady) {
          window.appToast(message, "error");
          return;
        }
        const card = document.createElement("section");
        card.className = "card";
        card.setAttribute("role", "alert");
        const heading = document.createElement("h1");
        heading.textContent = "載入失敗";
        const detail = document.createElement("p");
        detail.textContent = message;
        const reload = document.createElement("button");
        reload.type = "button";
        reload.className = "btn pri";
        reload.textContent = "重新載入";
        reload.addEventListener("click", () => location.reload());
        card.append(heading, detail, reload);
        document.getElementById("app").replaceChildren(card);
      }

      window.appError = showError;
      window.addEventListener("error", (event) => {
        if (event.target instanceof HTMLScriptElement) {
          showError("無法載入 " + event.target.getAttribute("src"));
        } else if (event.target === window) {
          showError(event.error || event.message);
        }
      }, true);
      window.addEventListener("unhandledrejection", (event) => showError(event.reason));
    })();
  </script>
  <script src="vendor/supabase-js-2.45.4.js?v=5dc29e79f4"></script>
  <script type="module" src="js/app.js?v=5dc29e79f4"></script>
